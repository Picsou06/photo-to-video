<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photos → Vidéo</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="card">
    <h1>Photos → Vidéo</h1>
    <p class="hint">
      Choisis plusieurs photos (dans l'ordre où tu veux qu'elles apparaissent),
      règle le nombre d'images par seconde, et télécharge la vidéo générée.
      {% if max_upload_mb > 0 %}Limite d'upload : {{ max_upload_mb }} Mo.{% endif %}
    </p>

    <div id="error" class="error" style="display:none"></div>

    <form id="video-form">
      <label>Photos</label>
      <input type="file" name="images" id="images" accept="image/*" multiple required>
      <div id="count" class="hint" style="margin-top:6px"></div>

      <label>Images par seconde</label>
      <input type="number" name="fps" id="fps" value="1" min="0.1" max="60" step="0.1" required>

      <button type="submit" id="submit-btn">Générer la vidéo</button>
    </form>

    <div id="progress-wrap" style="display:none">
      <div id="progress-label" class="hint"></div>
      <progress id="progress-bar" max="100" value="0"></progress>
    </div>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
